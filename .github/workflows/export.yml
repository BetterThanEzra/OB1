- name: Write to Google Doc
        run: |
          pip install google-auth google-auth-httplib2 google-api-python-client -q
          cat << 'EOF' > upload.py
          import os
          import json
          import base64
          from google.oauth2 import service_account
          from googleapiclient.discovery import build

          creds_json = base64.b64decode(os.environ['GDRIVE_CREDENTIALS']).decode('utf-8')
          creds_dict = json.loads(creds_json)
          creds = service_account.Credentials.from_service_account_info(
            creds_dict,
            scopes=[
              'https://www.googleapis.com/auth/documents',
              'https://www.googleapis.com/auth/drive'
            ]
          )
          docs = build('docs', 'v1', credentials=creds)
          doc_id = os.environ['GDRIVE_FILE_ID']

          with open('ob1-full-export.txt', 'r', encoding='utf-8') as f:
            content = f.read()

          # Get current end index
          doc = docs.documents().get(documentId=doc_id).execute()
          end_index = doc['body']['content'][-1]['endIndex']

          # Step 1: delete existing content (only if there's something to delete)
          if end_index > 2:
            docs.documents().batchUpdate(
              documentId=doc_id,
              body={'requests': [{
                'deleteContentRange': {
                  'range': {
                    'startIndex': 1,
                    'endIndex': end_index - 1
                  }
                }
              }]}
            ).execute()

          # Step 2: insert new content
          docs.documents().batchUpdate(
            documentId=doc_id,
            body={'requests': [{
              'insertText': {
                'location': {'index': 1},
                'text': content
              }
            }]}
          ).execute()

          print(f"Successfully wrote {len(content)} characters to Google Doc")
          EOF
          python upload.py
        env:
          GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
          GDRIVE_FILE_ID: ${{ secrets.GDRIVE_FILE_ID }}
